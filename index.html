    <meta name="theme-color" content="#FFFFFF" />
    <!-- Theme before the first paint: the visitor's choice, else the system
         setting. Keep the colours in step with THEME_COLOR in ThemeToggle.tsx. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#070B16" : "#FFFFFF");
      })();
    </script>
