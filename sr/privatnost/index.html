    <script>
      /* TEMP: theme preview switch, remove once the theme is chosen.
         "/" is always Kobalt; "?theme=industrial" is always Industrial.
         In Industrial mode, internal links keep the parameter (EN/SR, privacy). */
      (function () {
        if (new URLSearchParams(location.search).get("theme") !== "industrial") return;
        var root = document.documentElement;
        root.classList.remove("theme-kobalt");
        root.classList.add("theme-industrial");
        document.addEventListener("click", function (e) {
          var a = e.target.closest && e.target.closest('a[href^="/"]');
          if (!a) return;
          var url = new URL(a.getAttribute("href"), location.href);
          url.searchParams.set("theme", "industrial");
          a.setAttribute("href", url.pathname + url.search + url.hash);
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
